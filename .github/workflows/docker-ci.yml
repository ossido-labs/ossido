name: Docker CI

# If we need support more OS refer to
# https://github.com/tuono-labs/tuono/pull/332#issuecomment-2614439692

on:
  push:
    branches:
      - 'main'
  pull_request:

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: Build and Test Docker Image on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Docker Compose
        run: |
          docker compose -f docker/compose.yml up --build -d

      - name: Check if the container is running
        run: |
          docker ps --filter "name=ossido-source-container" --format "table {{.Names}}\t{{.Status}}"
          if ! docker ps --filter "name=ossido-source-container" --format "{{.Status}}" | grep -q "Up"; then
            echo "Error: Container 'ossido-source-container' is not running."
            exit 1
          fi

      - name: Check commands inside container
        run: |
          docker exec ossido-source-container bun --version || { echo "Error: bun is not available."; exit 1; }
          docker exec ossido-source-container ossido --version || { echo "Error: ossido is not available."; exit 1; }

      - name: Run cargo test
        run: docker exec ossido-source-container cargo test

      - name: Run bun test
        run: docker exec ossido-source-container bun run test

      - name: Tear Down Docker Compose
        if: always()
        run: |
          docker compose -f docker/compose.yml down --volumes
