name: Publish on npm and crates

on:
  release:
    types: [published]

jobs:
  publish_npm_dry_run:
    name: NPM publish (dry run) - ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # Order does not matter: `bun pm pack` rewrites each `workspace:*`
        # interlink to its concrete version in the tarball, and npm does not
        # verify that dependencies already exist on the registry at publish time.
        package:
          - ossido-ui
          - ossido-eslint-plugin
          - ossido-mdx
          - ossido-react-vite-plugin
          - ossido-router
          - ossido

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      # Stamp every manifest with the release tag version, then refresh the
      # workspace package versions in bun.lock so `bun pm pack` rewrites
      # workspace:* interlinks to it. Bun 1.4 fixed the refresh bug
      # (https://github.com/oven-sh/bun/pull/36285), so a plain
      # `bun install --lockfile-only` now does this (no node_modules churn).
      # Do NOT use the old `bun update --lockfile-only ./<pkg>` workaround:
      # bun 1.4 rejects path args, and by-name it acts like `bun add`,
      # grafting the package onto the root manifest.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun scripts/set-version.ts "${TAG#v}"
          bun install --lockfile-only

      - name: Build
        run: bun run build

      # Pack with bun (rewrites `workspace:*` -> concrete versions, which npm
      # cannot do), then validate the tarball with `npm publish --dry-run`. The
      # dry run also fails fast if the version already exists on the registry.
      - name: Pack and validate
        working-directory: packages/${{ matrix.package }}
        run: |
          TARBALL=$(bun pm pack --quiet --ignore-scripts | tail -1)
          npm publish "./$TARBALL" --dry-run --access public

  publish_crates_dry_run:
    name: Crates publish (dry run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp every crate manifest (package version + internal dep requirements)
      # with the release tag version before packaging.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/set-version.ts "${TAG#v}"

      # `--workspace` (not per-crate `-p`) so cargo resolves the bumped
      # interdependency versions from the local workspace — a per-crate dry run
      # would fail to resolve e.g. `ossido_internal = "<new>"` from crates.io
      # before it is published. `--no-verify` skips the compile (covered by Rust
      # CI); `--allow-dirty` includes the uncommitted version stamp.
      - name: Publish (dry run)
        run: cargo publish --workspace --dry-run --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_npm:
    name: NPM publish - ${{ matrix.package }}
    needs: [publish_npm_dry_run, publish_crates_dry_run]
    runs-on: ubuntu-latest

    # npm trusted publishing (OIDC): npm authenticates to the registry with a
    # short-lived GitHub OIDC token instead of a long-lived NPM_TOKEN, and emits
    # provenance automatically. A trusted publisher must be configured on
    # npmjs.com for each package (org=ossido-labs, repo=ossido, workflow=release.yml).
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: true
      matrix:
        package:
          - ossido-ui
          - ossido-eslint-plugin
          - ossido-mdx
          - ossido-react-vite-plugin
          - ossido-router
          - ossido

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      # Stamp every manifest with the release tag version, then refresh the
      # workspace package versions in bun.lock so `bun pm pack` rewrites
      # workspace:* interlinks to it. Bun 1.4 fixed the refresh bug
      # (https://github.com/oven-sh/bun/pull/36285), so a plain
      # `bun install --lockfile-only` now does this (no node_modules churn).
      # Do NOT use the old `bun update --lockfile-only ./<pkg>` workaround:
      # bun 1.4 rejects path args, and by-name it acts like `bun add`,
      # grafting the package onto the root manifest.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun scripts/set-version.ts "${TAG#v}"
          bun install --lockfile-only

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 already ships
      # npm 11.x; this guarantees the minimum regardless of the bundled version.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Clone root README.md on ossido package
        if: matrix.package == 'ossido'
        run: cp README.md packages/ossido/README.md

      - name: Build
        run: bun run build

      # Pack with bun so `workspace:*` interlinks become concrete versions (npm
      # cannot rewrite them); dist is already built above so skip prepack scripts.
      - name: Pack
        id: pack
        working-directory: packages/${{ matrix.package }}
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: npm uses the OIDC trusted publisher. Provenance is
      # generated automatically on GitHub Actions.
      - name: Publish to npm
        working-directory: packages/${{ matrix.package }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public

  publish_crates:
    name: Crates publish - ${{ matrix.crate }}
    needs: [publish_npm_dry_run, publish_crates_dry_run]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      # crates.io enforces that a crate's dependencies already exist on the
      # registry, so crates must publish sequentially in dependency order
      # (leaves first). `cargo publish` waits for the index to update before
      # returning, so a later crate sees its just-published dependency.
      max-parallel: 1
      matrix:
        crate:
          - ossido_macros
          - ossido_internal
          - ossido_ssr
          - ossido
          - ossido_cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp every crate manifest (package version + internal dep requirements)
      # with the release tag version before publishing.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/set-version.ts "${TAG#v}"

      # `--allow-dirty`: the version-stamp step above edits Cargo.toml in the
      # working tree without committing, which cargo otherwise refuses to package.
      - name: Publish
        run: cargo publish -p ${{ matrix.crate }} --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # --- ossido CLI: prebuilt native binary distributed via npm ---
  # `@ossido-labs/ossido-cli` is a JS launcher whose per-platform binaries ship
  # as `@ossido-labs/cli-*` optionalDependencies. `create-ossido` wraps it.

  publish_cli_dry_run:
    name: CLI npm packages (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun scripts/set-version.ts "${TAG#v}"
          bun install --lockfile-only

      # Fail fast if set-version missed the meta-package's optionalDependencies
      # (they must all equal the release version, or installs resolve stale binaries).
      - name: Assert optionalDependencies are pinned to the release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}" node -e '
            const p = require("./packages/ossido-cli/package.json");
            const bad = Object.entries(p.optionalDependencies || {})
              .filter(([, v]) => v !== process.env.VERSION);
            if (bad.length) {
              console.error("optionalDependencies not pinned to", process.env.VERSION, bad);
              process.exit(1);
            }
          '

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # Validate the tarball shape of the meta + create-ossido + every platform
      # package (platform binaries are absent here; `files` just omits them).
      - name: Pack and validate
        run: |
          for dir in packages/ossido-cli packages/create-ossido npm/platforms/*/; do
            echo "::group::$dir"
            TARBALL=$(cd "$dir" && bun pm pack --quiet --ignore-scripts | tail -1)
            (cd "$dir" && npm publish "./$TARBALL" --dry-run --access public)
            echo "::endgroup::"
          done

  build_cli_binaries:
    name: Build ossido binary - ${{ matrix.pkg }}
    needs: [publish_npm_dry_run, publish_crates_dry_run, publish_cli_dry_run]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              runner: macos-latest,
              target: aarch64-apple-darwin,
              pkg: darwin-arm64,
              exe: ossido,
              cross: false,
              features: '',
            }
          - {
              runner: macos-13,
              target: x86_64-apple-darwin,
              pkg: darwin-x64,
              exe: ossido,
              cross: false,
              features: '',
            }
          - {
              runner: windows-latest,
              target: x86_64-pc-windows-msvc,
              pkg: win32-x64-msvc,
              exe: ossido.exe,
              cross: false,
              features: '',
            }
          - {
              runner: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              pkg: linux-x64-gnu,
              exe: ossido,
              cross: false,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              pkg: linux-arm64-gnu,
              exe: ossido,
              cross: false,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              pkg: linux-x64-musl,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              pkg: linux-arm64-musl,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: armv7-unknown-linux-gnueabihf,
              pkg: linux-arm-gnueabihf,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp the crate version so the binary's `--version` / `crate_version!()`
      # (used by `ossido new` to pin templates) reports the release version.
      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/set-version.ts "${TAG#v}"

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `vendored-tls` builds OpenSSL from source so `native-tls` cross-compiles
      # cleanly and the Linux binaries are portable across distros. macOS/Windows
      # use their system TLS stacks and need no feature.
      - name: Build
        shell: bash
        run: |
          ARGS=(--release -p ossido_cli --target ${{ matrix.target }})
          if [ -n "${{ matrix.features }}" ]; then ARGS+=(--features "${{ matrix.features }}"); fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build "${ARGS[@]}"
          else
            cargo build "${ARGS[@]}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ossido-${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  publish_cli_platforms:
    name: NPM publish platform - ${{ matrix.pkg }}
    needs: [build_cli_binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { pkg: darwin-arm64, exe: ossido }
          - { pkg: darwin-x64, exe: ossido }
          - { pkg: win32-x64-msvc, exe: ossido.exe }
          - { pkg: linux-x64-gnu, exe: ossido }
          - { pkg: linux-arm64-gnu, exe: ossido }
          - { pkg: linux-x64-musl, exe: ossido }
          - { pkg: linux-arm64-musl, exe: ossido }
          - { pkg: linux-arm-gnueabihf, exe: ossido }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/set-version.ts "${TAG#v}"

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ossido-${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}/bin

      # upload-artifact drops the executable bit; restore it for unix binaries.
      - name: Restore executable bit
        if: matrix.exe == 'ossido'
        run: chmod +x npm/platforms/${{ matrix.pkg }}/bin/ossido

      - name: Pack
        id: pack
        working-directory: npm/platforms/${{ matrix.pkg }}
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: npm/platforms/${{ matrix.pkg }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public

  publish_cli_meta:
    name: NPM publish - ossido-cli (meta)
    # Publish the meta-package after its platform packages so an install right
    # after release can always resolve the matching binary.
    needs: [publish_cli_platforms]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun scripts/set-version.ts "${TAG#v}"
          bun install --lockfile-only

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Pack
        id: pack
        working-directory: packages/ossido-cli
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/ossido-cli
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public

  publish_create_ossido:
    name: NPM publish - create-ossido
    needs: [publish_cli_meta]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          bun scripts/set-version.ts "${TAG#v}"
          bun install --lockfile-only

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Pack
        id: pack
        working-directory: packages/create-ossido
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/create-ossido
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public

  commit_version_bump:
    name: Commit version bump
    # Only record the versions once everything actually published.
    needs:
      [
        publish_npm,
        publish_crates,
        publish_cli_platforms,
        publish_cli_meta,
        publish_create_ossido,
      ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp the released version onto main and commit it back so the repo
      # reflects what was published. `[skip ci]` stops this housekeeping commit
      # from re-triggering the CI workflows. The workspace package versions are
      # refreshed in bun.lock with `bun install --lockfile-only` (bun 1.4 fixed
      # https://github.com/oven-sh/bun/pull/36285, so a plain install refreshes
      # them; the old per-package `bun update` workaround breaks on bun 1.4).
      # Cargo.lock is git-ignored, so it needs no commit.
      - name: Stamp version and commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json npm/platforms/*/package.json crates/*/Cargo.toml bun.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
