name: Publish on npm and crates

on:
  release:
    types: [published]
  # Manual beta release: publishes every crate and npm package at
  # `<version>-beta.<UTC timestamp>Z`, npm dist-tagged `beta` (so `latest`
  # never moves) — see the `resolve` job.
  workflow_dispatch:
    inputs:
      version:
        description: 'Base semver for the beta (X.Y.Z — the -beta.<timestamp>Z suffix is appended)'
        required: true
        type: string

jobs:
  # Resolve the version this run publishes, once, so every job agrees:
  #  * release event — the tag name (a leading `v` is tolerated and stripped).
  #  * manual dispatch (beta) — `<input>-beta.<UTC timestamp>Z`. The single
  #    timestamp comes from this job's outputs, so all jobs stamp the same
  #    version; a fresh timestamp per dispatch also means a re-run never
  #    collides with an earlier partial beta on the immutable registries.
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - name: Resolve
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version must be bare semver (X.Y.Z), got '$INPUT_VERSION'"
              exit 1
            fi
            VERSION="${INPUT_VERSION}-beta.$(date -u +%Y%m%d%H%M%S)Z"
            DIST_TAG="beta"
          else
            VERSION="${TAG#v}"
            DIST_TAG="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $VERSION (npm dist-tag: $DIST_TAG)"

  # Betas have no GitHub release, but the published CLI pins its scaffold
  # templates to the git tag matching its crate version — push that tag for
  # the dispatched commit. Authenticated as the release app (ruleset bypass),
  # like the version-bump commit.
  tag_beta:
    name: Tag beta commit
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Push the beta tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

  publish_npm_dry_run:
    name: NPM publish (dry run) - ${{ matrix.package }}
    needs: resolve
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        # Order does not matter: `bun pm pack` rewrites each `workspace:*`
        # interlink to its concrete version in the tarball, and npm does not
        # verify that dependencies already exist on the registry at publish time.
        package:
          - ossido-ui
          - ossido-eslint-plugin
          - ossido-mdx
          - ossido-react-vite-plugin
          - ossido-router
          - ossido

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      # Stamp every manifest with the release tag version, then refresh the
      # workspace package versions in bun.lock so `bun pm pack` rewrites
      # workspace:* interlinks to it. Bun 1.4 fixed the refresh bug
      # (https://github.com/oven-sh/bun/pull/36285), so a plain
      # `bun install --lockfile-only` now does this (no node_modules churn).
      # Do NOT use the old `bun update --lockfile-only ./<pkg>` workaround:
      # bun 1.4 rejects path args, and by-name it acts like `bun add`,
      # grafting the package onto the root manifest.
      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only

      - name: Build
        run: bun run build

      # Pack with bun (rewrites `workspace:*` -> concrete versions, which npm
      # cannot do), then validate the tarball with `npm publish --dry-run`. On a
      # fresh release the dry run also fails fast if the version already exists;
      # on a RESUMED partially-published release an existing version is expected
      # — the dry-run publish is skipped (the tarball still packs, and the real
      # publish job skips the same package the same way).
      - name: Pack and validate
        working-directory: packages/${{ matrix.package }}
        run: |
          TARBALL=$(bun pm pack --quiet --ignore-scripts | tail -1)
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on npm - skipping dry-run publish"
          else
            npm publish "./$TARBALL" --dry-run --access public
          fi

  publish_crates_dry_run:
    name: Crates publish (dry run)
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp every crate manifest (package version + internal dep requirements)
      # with the release tag version before packaging.
      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/set-version.ts "$VERSION"

      # Resume support: when every workspace crate's version is already on
      # crates.io (a resumed partially-published release), there is nothing
      # left to validate — skip the dry run entirely. Keep the crate list in
      # sync with the publish_crates matrix. The API requires a descriptive
      # User-Agent (crates.io data-access policy).
      - name: Check crates.io for existing publishes
        id: published
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          ALL=true
          for crate in ossido_macros ossido_internal ossido_ssr ossido ossido_cli; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "ossido-release-workflow (github.com/ossido-labs/ossido)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")
            if [ "$STATUS" != "200" ]; then ALL=false; fi
          done
          if [ "$ALL" = "true" ]; then
            echo "::notice::all workspace crates already on crates.io at ${VERSION} - skipping dry run"
          fi
          echo "all=$ALL" >> "$GITHUB_OUTPUT"

      # `--workspace` (not per-crate `-p`) so cargo resolves the bumped
      # interdependency versions from the local workspace — a per-crate dry run
      # would fail to resolve e.g. `ossido_internal = "<new>"` from crates.io
      # before it is published. `--no-verify` skips the compile (covered by Rust
      # CI); `--allow-dirty` includes the uncommitted version stamp.
      - name: Publish (dry run)
        if: steps.published.outputs.all == 'false'
        run: cargo publish --workspace --dry-run --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish_npm:
    name: NPM publish - ${{ matrix.package }}
    needs: [resolve, publish_npm_dry_run, publish_crates_dry_run]
    runs-on: ubuntu-latest

    # npm trusted publishing (OIDC): npm authenticates to the registry with a
    # short-lived GitHub OIDC token instead of a long-lived NPM_TOKEN, and emits
    # provenance automatically. A trusted publisher must be configured on
    # npmjs.com for each package (org=ossido-labs, repo=ossido, workflow=release.yml).
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: true
      matrix:
        package:
          - ossido-ui
          - ossido-eslint-plugin
          - ossido-mdx
          - ossido-react-vite-plugin
          - ossido-router
          - ossido

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      # Stamp every manifest with the release tag version, then refresh the
      # workspace package versions in bun.lock so `bun pm pack` rewrites
      # workspace:* interlinks to it. Bun 1.4 fixed the refresh bug
      # (https://github.com/oven-sh/bun/pull/36285), so a plain
      # `bun install --lockfile-only` now does this (no node_modules churn).
      # Do NOT use the old `bun update --lockfile-only ./<pkg>` workaround:
      # bun 1.4 rejects path args, and by-name it acts like `bun add`,
      # grafting the package onto the root manifest.
      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Node 24 already ships
      # npm 11.x; this guarantees the minimum regardless of the bundled version.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Clone root README.md on ossido package
        if: matrix.package == 'ossido'
        run: cp README.md packages/ossido/README.md

      - name: Build
        run: bun run build

      # Resume support: registry versions are immutable, so when a partially-
      # published release is re-run, packages that already made it out must be
      # skipped rather than re-published (which would fail the whole run).
      - name: Check npm for an existing publish
        id: published
        working-directory: packages/${{ matrix.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Pack with bun so `workspace:*` interlinks become concrete versions (npm
      # cannot rewrite them); dist is already built above so skip prepack scripts.
      - name: Pack
        id: pack
        working-directory: packages/${{ matrix.package }}
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: npm uses the OIDC trusted publisher. Provenance is
      # generated automatically on GitHub Actions.
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --tag ${{ needs.resolve.outputs.dist_tag }}

  publish_crates:
    name: Crates publish - ${{ matrix.crate }}
    needs: [resolve, publish_npm_dry_run, publish_crates_dry_run]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      # crates.io enforces that a crate's dependencies already exist on the
      # registry, so crates must publish sequentially in dependency order
      # (leaves first). `cargo publish` waits for the index to update before
      # returning, so a later crate sees its just-published dependency.
      max-parallel: 1
      matrix:
        crate:
          - ossido_macros
          - ossido_internal
          - ossido_ssr
          - ossido
          - ossido_cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp every crate manifest (package version + internal dep requirements)
      # with the release tag version before publishing.
      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/set-version.ts "$VERSION"

      # Resume support: crates.io versions are immutable, so a re-run of a
      # partially-published release must skip crates that already made it out.
      # The API requires a descriptive User-Agent (their data-access policy).
      - name: Check crates.io for an existing publish
        id: published
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "ossido-release-workflow (github.com/ossido-labs/ossido)" \
            "https://crates.io/api/v1/crates/${{ matrix.crate }}/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.crate }}@${VERSION} is already on crates.io - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # `--allow-dirty`: the version-stamp step above edits Cargo.toml in the
      # working tree without committing, which cargo otherwise refuses to package.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: cargo publish -p ${{ matrix.crate }} --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # --- ossido CLI: prebuilt native binary distributed via npm ---
  # `@ossido-labs/ossido-cli` is a JS launcher whose per-platform binaries ship
  # as `@ossido-labs/cli-*` optionalDependencies. `create-ossido` wraps it.

  publish_cli_dry_run:
    name: CLI npm packages (dry run)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only

      # Fail fast if set-version missed the meta-package's optionalDependencies
      # (they must all equal the release version, or installs resolve stale binaries).
      - name: Assert optionalDependencies are pinned to the release version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e '
            const p = require("./packages/ossido-cli/package.json");
            const bad = Object.entries(p.optionalDependencies || {})
              .filter(([, v]) => v !== process.env.VERSION);
            if (bad.length) {
              console.error("optionalDependencies not pinned to", process.env.VERSION, bad);
              process.exit(1);
            }
          '

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # Validate the tarball shape of the meta + create-ossido + every platform
      # package (platform binaries are absent here; `files` just omits them).
      # Resume support: a package already on npm at this version (from a prior
      # partial run) skips its dry-run publish — the tarball still packs.
      - name: Pack and validate
        run: |
          for dir in packages/ossido-cli packages/create-ossido npm/platforms/*/; do
            echo "::group::$dir"
            TARBALL=$(cd "$dir" && bun pm pack --quiet --ignore-scripts | tail -1)
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
              echo "::notice::${NAME}@${VERSION} is already on npm - skipping dry-run publish"
            else
              (cd "$dir" && npm publish "./$TARBALL" --dry-run --access public)
            fi
            echo "::endgroup::"
          done

  build_cli_binaries:
    name: Build ossido binary - ${{ matrix.pkg }}
    needs:
      [
        resolve,
        publish_npm_dry_run,
        publish_crates_dry_run,
        publish_cli_dry_run,
      ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - {
              runner: macos-latest,
              target: aarch64-apple-darwin,
              pkg: darwin-arm64,
              exe: ossido,
              cross: false,
              features: '',
            }
          # darwin-x64 cross-compiles on the arm64 runner: macos-13 (the last
          # Intel runner) is retired, and Xcode's toolchain builds x86_64 from
          # Apple Silicon natively — `--target` plus the rustup target (added by
          # setup-rust-toolchain) is all it needs. The v8 crate downloads its
          # prebuilt static library per --target, so nothing compiles V8.
          - {
              runner: macos-latest,
              target: x86_64-apple-darwin,
              pkg: darwin-x64,
              exe: ossido,
              cross: false,
              features: '',
            }
          - {
              runner: windows-latest,
              target: x86_64-pc-windows-msvc,
              pkg: win32-x64-msvc,
              exe: ossido.exe,
              cross: false,
              features: '',
            }
          - {
              runner: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              pkg: linux-x64-gnu,
              exe: ossido,
              cross: false,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-gnu,
              pkg: linux-arm64-gnu,
              exe: ossido,
              cross: false,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              pkg: linux-x64-musl,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: aarch64-unknown-linux-musl,
              pkg: linux-arm64-musl,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
          - {
              runner: ubuntu-latest,
              target: armv7-unknown-linux-gnueabihf,
              pkg: linux-arm-gnueabihf,
              exe: ossido,
              cross: true,
              features: vendored-tls,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `cache: false`: release binary builds must be hermetic. The action's
      # default cache saves even from failed/cancelled runs (CACHE_ON_FAILURE),
      # and a cache cut mid-build by a fail-fast cancellation poisons later
      # runs — cargo's fingerprints claim host proc-macro artifacts (e.g.
      # thiserror_impl) exist when they don't, which surfaces as E0463 inside
      # the cross containers. Releases are rare; a full rebuild is the price of
      # a binary that never depends on leftover state.
      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp the crate version so the binary's `--version` / `crate_version!()`
      # (used by `ossido new` to pin templates) reports the release version.
      # `shell: bash` is required: this matrix includes windows-latest, whose
      # default shell is PowerShell — there env vars read as `$env:VERSION`,
      # so a bare `"$VERSION"` expands to "" and fails set-version's semver
      # check.
      - name: Set version from release tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/set-version.ts "$VERSION"

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # `vendored-tls` builds OpenSSL from source so `native-tls` cross-compiles
      # cleanly and the Linux binaries are portable across distros. macOS/Windows
      # use their system TLS stacks and need no feature.
      - name: Build
        shell: bash
        run: |
          ARGS=(--release -p ossido_cli --target ${{ matrix.target }})
          if [ -n "${{ matrix.features }}" ]; then ARGS+=(--features "${{ matrix.features }}"); fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build "${ARGS[@]}"
          else
            cargo build "${ARGS[@]}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ossido-${{ matrix.pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  publish_cli_platforms:
    name: NPM publish platform - ${{ matrix.pkg }}
    needs: [resolve, build_cli_binaries]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { pkg: darwin-arm64, exe: ossido }
          - { pkg: darwin-x64, exe: ossido }
          - { pkg: win32-x64-msvc, exe: ossido.exe }
          - { pkg: linux-x64-gnu, exe: ossido }
          - { pkg: linux-arm64-gnu, exe: ossido }
          - { pkg: linux-x64-musl, exe: ossido }
          - { pkg: linux-arm64-musl, exe: ossido }
          - { pkg: linux-arm-gnueabihf, exe: ossido }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Node via setup-node, like every other npm job (the rest get it through
      # the install-node-dependencies composite): setup-node's tool-cache
      # install is user-owned, so the npm self-update below needs no
      # privileges. The runner image's system node lives in root-owned
      # /usr/local, where an unprivileged `npm install -g` fails with EACCES.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bun scripts/set-version.ts "$VERSION"

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ossido-${{ matrix.pkg }}
          path: npm/platforms/${{ matrix.pkg }}/bin

      # upload-artifact drops the executable bit; restore it for unix binaries.
      - name: Restore executable bit
        if: matrix.exe == 'ossido'
        run: chmod +x npm/platforms/${{ matrix.pkg }}/bin/ossido

      # Resume support: skip platform packages a previous partial run published.
      - name: Check npm for an existing publish
        id: published
        working-directory: npm/platforms/${{ matrix.pkg }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        working-directory: npm/platforms/${{ matrix.pkg }}
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: npm/platforms/${{ matrix.pkg }}
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --tag ${{ needs.resolve.outputs.dist_tag }}

  publish_cli_meta:
    name: NPM publish - ossido-cli (meta)
    # Publish the meta-package after its platform packages so an install right
    # after release can always resolve the matching binary.
    needs: [resolve, publish_cli_platforms]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # Resume support: skip if a previous partial run already published it.
      - name: Check npm for an existing publish
        id: published
        working-directory: packages/ossido-cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        working-directory: packages/ossido-cli
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/ossido-cli
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --tag ${{ needs.resolve.outputs.dist_tag }}

  publish_create_ossido:
    name: NPM publish - create-ossido
    needs: [resolve, publish_cli_meta]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS Dependencies
        uses: ./.github/actions/install-node-dependencies

      - name: Set version from release tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      # Resume support: skip if a previous partial run already published it.
      - name: Check npm for an existing publish
        id: published
        working-directory: packages/create-ossido
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm - skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        id: pack
        working-directory: packages/create-ossido
        run: echo "tarball=$(bun pm pack --quiet --ignore-scripts | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        working-directory: packages/create-ossido
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --tag ${{ needs.resolve.outputs.dist_tag }}

  commit_version_bump:
    name: Commit version bump
    # Only record the versions once everything actually published — and only
    # for stable releases: a beta must not stamp its throwaway version onto main.
    if: github.event_name == 'release'
    needs:
      [
        resolve,
        publish_npm,
        publish_crates,
        publish_cli_platforms,
        publish_cli_meta,
        publish_create_ossido,
      ]
    runs-on: ubuntu-latest

    # The push authenticates as the release GitHub App (below), which is on the
    # ruleset bypass list — the default GITHUB_TOKEN cannot push to main under
    # the push rules, so this job needs no write permission of its own.
    permissions:
      contents: read

    steps:
      # Mint a short-lived installation token for the release app (repo-scoped,
      # Contents: read/write, expires in an hour). The app must be installed on
      # this repo and added to the ruleset's bypass list.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Persisted for the `git push` below, replacing GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Stamp the released version onto main and commit it back so the repo
      # reflects what was published. `[skip ci]` stops this housekeeping commit
      # from re-triggering the CI workflows. The workspace package versions are
      # refreshed in bun.lock with `bun install --lockfile-only` (bun 1.4 fixed
      # https://github.com/oven-sh/bun/pull/36285, so a plain install refreshes
      # them; the old per-package `bun update` workaround breaks on bun 1.4).
      # Cargo.lock is git-ignored, so it needs no commit.
      - name: Stamp version and commit
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          bun scripts/set-version.ts "$VERSION"
          bun install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json npm/platforms/*/package.json crates/*/Cargo.toml bun.lock
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
