name: Install NodeJS Dependencies
description: This is a composite GitHub Action that sets up Bun, Node and installs the project's dependencies.

inputs:
  node-version:
    description: 'Explicit node version. Otherwise fallback reading `.nvmrc`. Use in conjunction with matrix'
    required: false
  registry-url:
    description: 'https://github.com/actions/setup-node?tab=readme-ov-file#usage'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0

    # Node is still required: Playwright and the e2e webServer command run under
    # `node`. Bun is the package manager and script runner.
    - name: Setup Node.js (via input)
      if: ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Node.js (via .nvmrc)
      if: ${{ !inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        registry-url: ${{ inputs.registry-url }}

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
