[package]
name = "ossido"
version = "0.1.8"
edition = "2024"
authors = ["Chris Schofield <chris@childishforces.com>"]
description = "Superfast React fullstack framework"
homepage = "https://ossido.dev"
keywords = [ "react", "typescript", "fullstack", "web", "ssr"]
repository = "https://github.com/ossido-labs/ossido"
readme = "../../README.md"
license-file = "../../LICENSE.md"
categories = ["web-programming"]
include = [
    "src/**/*.rs",
    "Cargo.toml"
]


[dependencies]
# Vendored, in-repo SSR engine (the stagnant upstream `ssr_rs`, renamed). Its
# streaming bridge in `crate::ssr` builds on the `render` single-named-export +
# surfaced `JsException` errors. A path dependency (unlike a workspace `[patch]`)
# propagates transitively, so the excluded fixture/example apps that build
# against this crate resolve it too.
ossido_ssr = { path = "../ossido_ssr", version = "0.1.8" }
axum = {version = "0.8.9", features = ["json", "ws"]}
axum-extra = {version = "0.12.6", features = ["cookie"]}
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
erased-serde = "0.4.10"
serde_json = { version = "1.0", features = ["raw_value"] }
serde_urlencoded = "0.7.1"
# Multipart parser (the same crate axum uses) for `multipart/form-data` server
# actions — parsed from the already-buffered request body.
multer = "3.1.0"
# reqwest 0.13 switched its default TLS backend from native-tls to rustls
# (pulling aws-lc-sys, which needs cmake + a C toolchain). Keep native-tls
# explicitly to preserve 0.12's build footprint. `default-features = false`
# drops the rustls `default-tls`, so re-add the other former defaults.
reqwest = {version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "form"]}
once_cell = "1.21.4"
crossbeam-channel = "0.5"
regex = "1.13.1"
either = "1.17.0"
tower-http = {version = "0.7.0", features = ["fs", "compression-br", "compression-gzip"]}
brotli = "8"
colored = "3.1.1"

ossido_macros = {path = "../ossido_macros", version = "0.1.8"}
ossido_internal = {path = "../ossido_internal", version = "0.1.8"}
# Match the same version used by axum
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tungstenite = "0.29.0"
http = "1.5.0"
pin-project = "1.1.13"
tower = "0.5.3"
# Instrumentation API. Unconditional (it is already in the dependency graph and
# compiles to a no-op atomic check when no subscriber is installed); the OTel
# SDK/exporter stack below is what the `telemetry` feature actually gates.
tracing = "0.1"

# OpenTelemetry (traces + logs over OTLP http/protobuf). All `opentelemetry*`
# crates plus `tracing-opentelemetry` must be bumped in lockstep (0.32 pairs
# with tracing-opentelemetry 0.33) — a mismatch produces two copies of
# `opentelemetry` and baffling trait errors.
#
# `reqwest-blocking-client` + the SDK's thread-based batch processors keep the
# export path off the tokio runtime. It does not enable reqwest's rustls
# features, so feature unification with the `reqwest` dependency above keeps
# the native-tls-only build footprint.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "logs", "internal-logs"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "logs", "reqwest-blocking-client", "internal-logs"], optional = true }
opentelemetry-http = { version = "0.32", optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }
# Its default `metrics` feature would drag `opentelemetry/metrics` in.
tracing-opentelemetry = { version = "0.33", default-features = false, features = ["tracing-log"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "env-filter"], optional = true }

[features]
default = ["telemetry"]
# Opt-in OpenTelemetry traces + logs (enabled at runtime via `OTEL_*` env
# vars). Compile with `default-features = false` to drop the SDK/exporter
# dependency weight entirely.
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "reqwest/blocking",
]

[dev-dependencies]
fs_extra = "1.3.0"
tempfile = "3.27.0"
serial_test = "4.0.1"
# In-test OTLP receiver: decodes the http/protobuf export bodies. The
# `gen-tonic-messages` feature generates plain prost messages — no tonic.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"

[[bench]]
name = "streaming_vs_buffered"
harness = false

[[bench]]
name = "compile_code_cache"
harness = false

[[bench]]
name = "react_render"
harness = false
