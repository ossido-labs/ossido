StylesPath = .github/styles
MinAlertLevel = warning

# Project accept-list (see .github/styles/config/vocabularies/Ossido/accept.txt)
Vocab = Ossido

# Treat .mdx as Markdown
[formats]
mdx = md

# Only lint Markdown & MDX; spelling + repeated-word, nothing stylistic.
# Vale skips fenced code blocks and inline code by default.
[*.{md,mdx}]
BasedOnStyles = Vale
Vale.Terms = NO
