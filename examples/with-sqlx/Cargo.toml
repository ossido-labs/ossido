[package]
name = "with-sqlx"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "ossido"
path = ".ossido/main.rs"

[dependencies]
ossido = { path = "../../crates/ossido" }
serde = { version = "1.0.202", features = ["derive"] }
# `runtime-tokio` + `sqlite` — no TLS backend needed for a local sqlite file.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Trade compile time for run-time performance in production builds. No
# `panic = "abort"` — ossido's SSR render pool relies on unwinding to recover
# from a failed render.
[profile.release]
lto = "fat"
codegen-units = 1
